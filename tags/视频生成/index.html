<!-- 初始化程式碼高亮 -->
<script>
  document.addEventListener('DOMContentLoaded', function() {
    // 统一 Hexo 输出与 Prism 的语言类，避免重复包装和重复行号。
    document.querySelectorAll('.post-content pre > code, .page-body pre > code').forEach(function(block) {
      const content = block.textContent;
      let lang = 'plaintext';
      const languageClass = Array.from(block.classList).find(function(name) {
        return name.startsWith('language-');
      });
      const hexoClass = Array.from(block.classList).find(function(name) {
        return name !== 'highlight' && name !== 'hljs';
      });

      if (languageClass) {
        lang = languageClass.replace('language-', '');
      } else if (hexoClass) {
        lang = hexoClass;
      } else if (content.includes('#include') || content.includes('int main')) {
        lang = 'cpp';
      } else if (content.includes('def ') || content.includes('import ')) {
        lang = 'python';
      } else if (content.includes('function') || content.includes('const ')) {
        lang = 'javascript';
      }

      block.className = 'language-' + lang;
      block.parentElement.className = 'language-' + lang;
      block.parentElement.dataset.language = lang.toUpperCase();

      if (typeof Prism !== 'undefined' && Prism.languages[lang]) {
        Prism.highlightElement(block);
      }
    });
  });
</script>
