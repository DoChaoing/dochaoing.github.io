<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="740" viewBox="0 0 1200 740" role="img" aria-labelledby="title desc">
  <title id="title">Python 开源 AI 项目学习阶梯</title><desc id="desc">从调用模型到构建 Agent 的七个开源项目学习路径</desc>
  <defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#f7fbff"/><stop offset="1" stop-color="#f8f5ff"/></linearGradient><filter id="s" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="8" stdDeviation="9" flood-color="#264778" flood-opacity=".12"/></filter><style>.t{font:700 38px -apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif;fill:#102a43}.st{font:400 18px -apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif;fill:#627d98}.h{font:700 18px -apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif;fill:#102a43}.p{font:400 14px -apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif;fill:#486581}.n{font:700 15px -apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif;fill:#fff}</style></defs>
  <rect width="1200" height="740" rx="32" fill="url(#bg)"/><circle cx="82" cy="79" r="11" fill="#20b486"/><circle cx="1110" cy="90" r="18" fill="#7f5af0" opacity=".18"/>
  <text x="108" y="88" class="t">Python 新手的开源 AI 项目学习阶梯</text><text x="108" y="125" class="st">每次只多引入一个新概念：先跑通，再解释，再组合。</text>
  <path d="M100 637H1100" stroke="#b6c9e1" stroke-width="4" stroke-linecap="round"/><path d="M100 637H1100" stroke="#2f80ed" stroke-width="4" stroke-dasharray="2 15" stroke-linecap="round"/>
  <g filter="url(#s)"><rect x="72" y="467" width="256" height="138" rx="20" fill="#fff" stroke="#2f80ed" stroke-width="2"/><circle cx="108" cy="505" r="19" fill="#2f80ed"/><text x="103" y="511" class="n">1</text><text x="141" y="510" class="h">Transformers</text><text x="100" y="546" class="p">让预训练模型完成一件事</text><text x="100" y="574" class="p">交付：可重复运行的推理脚本</text></g>
  <g filter="url(#s)"><rect x="236" y="379" width="256" height="138" rx="20" fill="#fff" stroke="#20b486" stroke-width="2"/><circle cx="272" cy="417" r="19" fill="#20b486"/><text x="267" y="423" class="n">2</text><text x="305" y="422" class="h">Ollama Python</text><text x="264" y="458" class="p">把模型放到自己的电脑上</text><text x="264" y="486" class="p">交付：本地命令行小工具</text></g>
  <g filter="url(#s)"><rect x="400" y="291" width="256" height="138" rx="20" fill="#fff" stroke="#f0a229" stroke-width="2"/><circle cx="436" cy="329" r="19" fill="#f0a229"/><text x="431" y="335" class="n">3</text><text x="469" y="334" class="h">Gradio</text><text x="428" y="370" class="p">把函数变成可试用界面</text><text x="428" y="398" class="p">交付：有错误提示的 Demo</text></g>
  <g filter="url(#s)"><rect x="564" y="203" width="256" height="138" rx="20" fill="#fff" stroke="#7f5af0" stroke-width="2"/><circle cx="600" cy="241" r="19" fill="#7f5af0"/><text x="595" y="247" class="n">4</text><text x="633" y="246" class="h">FastAPI</text><text x="592" y="282" class="p">让能力成为可测试服务</text><text x="592" y="310" class="p">交付：API、Schema、测试</text></g>
  <g filter="url(#s)"><rect x="728" y="291" width="256" height="138" rx="20" fill="#fff" stroke="#e96d8d" stroke-width="2"/><circle cx="764" cy="329" r="19" fill="#e96d8d"/><text x="759" y="335" class="n">5</text><text x="797" y="334" class="h">Qdrant Client</text><text x="756" y="370" class="p">让回答能够找到资料来源</text><text x="756" y="398" class="p">交付：带出处的本地检索</text></g>
  <g filter="url(#s)"><rect x="892" y="379" width="256" height="138" rx="20" fill="#fff" stroke="#2f80ed" stroke-width="2"/><circle cx="928" cy="417" r="19" fill="#2f80ed"/><text x="923" y="423" class="n">6</text><text x="961" y="422" class="h">smolagents</text><text x="920" y="458" class="p">让模型在边界内调用工具</text><text x="920" y="486" class="p">交付：可追溯的工具调用</text></g>
  <g filter="url(#s)"><rect x="728" y="555" width="256" height="138" rx="20" fill="#fff" stroke="#20b486" stroke-width="2"/><circle cx="764" cy="593" r="19" fill="#20b486"/><text x="759" y="599" class="n">7</text><text x="797" y="598" class="h">Tiny-Universe</text><text x="756" y="634" class="p">打开黑盒，读懂一个组件</text><text x="756" y="662" class="p">交付：带测试的原理实验</text></g>
  <path d="M328 485L236 447M492 397L400 359M656 309L564 271M820 271L728 309M984 359L892 397M1018 517L930 555" fill="none" stroke="#7b95b3" stroke-width="3" stroke-linecap="round" stroke-dasharray="7 8"/>
  <rect x="72" y="161" width="1056" height="1" fill="#d9e5f1"/><text x="72" y="194" class="h">读图方式</text><text x="170" y="194" class="p">每完成一格，就留下一个可运行、可解释、可复现的小成果；下一格只建立在上一格之上。</text>
