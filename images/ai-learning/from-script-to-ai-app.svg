<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="500" viewBox="0 0 1200 500" role="img" aria-labelledby="title desc">
  <title id="title">从 Python 脚本到可靠 AI 应用</title><desc id="desc">模型能力经由界面服务检索和受限工具逐步构成 AI 应用</desc>
  <defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#fffdf8"/><stop offset="1" stop-color="#f4f8ff"/></linearGradient><filter id="s" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="8" stdDeviation="9" flood-color="#264778" flood-opacity=".11"/></filter><marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0L10 5L0 10z" fill="#5e7ea4"/></marker><style>.t{font:700 33px -apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif;fill:#102a43}.h{font:700 18px -apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif;fill:#102a43}.p{font:400 14px -apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif;fill:#486581}.n{font:700 15px -apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif;fill:#fff}</style></defs>
  <rect width="1200" height="500" rx="32" fill="url(#bg)"/><text x="64" y="74" class="t">一个 AI 应用，究竟是怎样一步步长出来的？</text><text x="64" y="110" class="p">不要同时上所有框架；每加一层，都回答它解决了什么问题。</text>
  <path d="M234 260H306M474 260H546M714 260H786M954 260H1026" stroke="#5e7ea4" stroke-width="3" marker-end="url(#a)"/>
  <g filter="url(#s)"><rect x="64" y="178" width="170" height="166" rx="20" fill="#fff" stroke="#2f80ed" stroke-width="2"/><circle cx="92" cy="207" r="16" fill="#2f80ed"/><text x="88" y="212" class="n">1</text><text x="94" y="250" class="h">模型调用</text><text x="94" y="278" class="p">输入 → 输出</text><text x="94" y="305" class="p">先验证能力本身</text></g>
  <g filter="url(#s)"><rect x="304" y="178" width="170" height="166" rx="20" fill="#fff" stroke="#f0a229" stroke-width="2"/><circle cx="332" cy="207" r="16" fill="#f0a229"/><text x="328" y="212" class="n">2</text><text x="334" y="250" class="h">界面 / API</text><text x="334" y="278" class="p">让人和程序能用</text><text x="334" y="305" class="p">处理输入与失败</text></g>
  <g filter="url(#s)"><rect x="544" y="178" width="170" height="166" rx="20" fill="#fff" stroke="#7f5af0" stroke-width="2"/><circle cx="572" cy="207" r="16" fill="#7f5af0"/><text x="568" y="212" class="n">3</text><text x="574" y="250" class="h">检索</text><text x="574" y="278" class="p">问题 → 资料片段</text><text x="574" y="305" class="p">结果必须带来源</text></g>
  <g filter="url(#s)"><rect x="784" y="178" width="170" height="166" rx="20" fill="#fff" stroke="#e96d8d" stroke-width="2"/><circle cx="812" cy="207" r="16" fill="#e96d8d"/><text x="808" y="212" class="n">4</text><text x="814" y="250" class="h">工具调用</text><text x="814" y="278" class="p">模型选择工具</text><text x="814" y="305" class="p">限制权限与步数</text></g>
  <g filter="url(#s)"><rect x="1024" y="178" width="112" height="166" rx="20" fill="#effaf5" stroke="#20b486" stroke-width="2"/><text x="1052" y="238" class="h">验收</text><text x="1044" y="270" class="p">日志</text><text x="1044" y="296" class="p">测试</text><text x="1044" y="322" class="p">边界</text></g>
  <path d="M1080 367C1080 440 150 440 150 367" fill="none" stroke="#20b486" stroke-width="3" stroke-dasharray="8 9" marker-end="url(#a)"/><text x="478" y="454" class="p">每一次失败都回流为：更好的测试样本、错误提示和权限边界。</text>
</svg>
